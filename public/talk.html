<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramantra call</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 18px; padding: 12px 20px; margin: 6px 6px 6px 0; }
  #status { margin: 16px 0; padding: 12px; background: #f1f1f1; border-radius: 8px; }
</style>
</head>
<body>
<h2>Paramantra call</h2>
<div id="status">Ready. Click "Start talking" and allow the microphone.</div>
<div style="height:10px;background:#ddd;border-radius:5px;overflow:hidden;margin-bottom:12px"><div id="bar" style="height:100%;width:0;background:#2a9d4a"></div></div>
<button id="start">Start talking</button>
<button id="hang" disabled>Hang up</button>
<button id="mute" disabled>Mute</button>
<div id="modeNote" style="color:#b00020;font-weight:600;margin:8px 0"></div>

<script>
(function () {
  var token = new URLSearchParams(location.search).get("token");
  var statusEl = document.getElementById("status");
  var startBtn = document.getElementById("start");
  var hangBtn = document.getElementById("hang");
  var bar = document.getElementById("bar");
  var muteBtn = document.getElementById("mute");
  var modeNote = document.getElementById("modeNote");
  var muted = false;
  var ws = null, stream = null, ctx = null;

  var labels = {
    waiting: "Connected to the bridge. Waiting for the call...",
    callStatePending: "Calling... waiting for them to answer",
    callStateExchangingKeys: "Connecting...",
    callStateReady: "Answered. Setting up audio...",
    audio_connected: "Connected. You can talk now.",
    callStateHangingUp: "Hanging up...",
    callStateDiscarded: "Call ended.",
    callStateError: "Call error."
  };

  // Converts the microphone to 48 kHz mono 16-bit PCM for the bridge.
  var workletSrc =
    "class P extends AudioWorkletProcessor {" +
    "  constructor() { super(); this.pos = 0; this.acc = []; }" +
    "  process(inputs) {" +
    "    var x = inputs[0] && inputs[0][0];" +
    "    if (!x) return true;" +
    "    var step = sampleRate / 48000;" +
    "    while (this.pos < x.length) {" +
    "      var i = Math.floor(this.pos), f = this.pos - i;" +
    "      var a = x[i];" +
    "      var b = (i + 1 < x.length) ? x[i + 1] : x[x.length - 1];" +
    "      this.acc.push(a + (b - a) * f);" +
    "      this.pos += step;" +
    "    }" +
    "    this.pos -= x.length;" +
    "    if (this.acc.length >= 960) {" +
    "      var n = this.acc.length, out = new Int16Array(n);" +
    "      for (var k = 0; k < n; k++) {" +
    "        var s = Math.max(-1, Math.min(1, this.acc[k]));" +
    "        out[k] = s < 0 ? s * 32768 : s * 32767;" +
    "      }" +
    "      this.acc = [];" +
    "      this.port.postMessage(out.buffer, [out.buffer]);" +
    "    }" +
    "    return true;" +
    "  }" +
    "}" +
    "registerProcessor('pcm48k', P);" +
    "class Pl extends AudioWorkletProcessor {" +
    "  constructor() {" +
    "    super(); this.q = []; this.qi = 0; this.frac = 0; this.len = 0;" +
    "    this.port.onmessage = (e) => {" +
    "      var i16 = new Int16Array(e.data), f = new Float32Array(i16.length);" +
    "      for (var k = 0; k < i16.length; k++) f[k] = i16[k] / 32768;" +
    "      this.q.push(f); this.len += f.length;" +
    "      if (this.len > 24000) { this.q = [f]; this.qi = 0; this.len = f.length; }" +
    "    };" +
    "  }" +
    "  process(inputs, outputs) {" +
    "    var out = outputs[0][0], step = 48000 / sampleRate;" +
    "    for (var n = 0; n < out.length; n++) {" +
    "      var cur = this.q[0];" +
    "      if (!cur) { out[n] = 0; continue; }" +
    "      var a = cur[this.qi], b;" +
    "      if (this.qi + 1 < cur.length) b = cur[this.qi + 1];" +
    "      else if (this.q.length > 1) b = this.q[1][0];" +
    "      else b = a;" +
    "      out[n] = a + (b - a) * this.frac;" +
    "      this.frac += step;" +
    "      while (this.frac >= 1 && cur) {" +
    "        this.frac -= 1; this.qi++; this.len--;" +
    "        if (this.qi >= cur.length) { this.q.shift(); this.qi = 0; cur = this.q[0]; }" +
    "      }" +
    "      if (!cur) this.frac = 0;" +
    "    }" +
    "    return true;" +
    "  }" +
    "}" +
    "registerProcessor('player', Pl);";

  function setStatus(t) { statusEl.textContent = t; }

  function cleanup() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    if (ctx) { ctx.close(); ctx = null; }
    startBtn.disabled = false;
    hangBtn.disabled = true;
    muteBtn.disabled = true;
    muted = false;
    muteBtn.textContent = "Mute";
  }

  async function start() {
    if (!token) { setStatus("Missing token in the address."); return; }
    startBtn.disabled = true;

    try {
      // Add &raw=1 to the page address to switch the browser's noise cleanup off.
      var raw = new URLSearchParams(location.search).get("raw") === "1";
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: !raw,
          noiseSuppression: !raw,
          autoGainControl: !raw
        }
      });
    } catch (e) {
      setStatus("Microphone blocked: " + e.message);
      startBtn.disabled = false;
      return;
    }

    ctx = new (window.AudioContext || window.webkitAudioContext)();
    var blobUrl = URL.createObjectURL(new Blob([workletSrc], { type: "application/javascript" }));
    await ctx.audioWorklet.addModule(blobUrl);

    var src = ctx.createMediaStreamSource(stream);
    var node = new AudioWorkletNode(ctx, "pcm48k");
    var mute = ctx.createGain();
    mute.gain.value = 0; // keeps the graph running without playing your own voice

    src.connect(node);
    node.connect(mute);
    mute.connect(ctx.destination);

    // Plays the other person's voice coming back from the bridge.
    var player = new AudioWorkletNode(ctx, "player", { outputChannelCount: [1] });
    player.connect(ctx.destination);
    ctx.resume();

    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/audio?token=" + encodeURIComponent(token));
    ws.binaryType = "arraybuffer";

    node.port.onmessage = function (e) {
      if (muted) {
        // While muted, send silence so the other person hears nothing.
        bar.style.width = "0%";
        if (ws && ws.readyState === 1) ws.send(new ArrayBuffer(e.data.byteLength));
        return;
      }
      // Green bar = your microphone level. If it never moves, the mic is silent.
      var a = new Int16Array(e.data), p = 0;
      for (var i = 0; i < a.length; i++) { var v = a[i] < 0 ? -a[i] : a[i]; if (v > p) p = v; }
      bar.style.width = Math.min(100, Math.round(p / 327.67)) + "%";
      if (ws && ws.readyState === 1) ws.send(e.data);
    };

    ws.onopen = function () { setStatus("Connected to the bridge."); hangBtn.disabled = false; muteBtn.disabled = false; };
    ws.onmessage = function (e) {
      if (typeof e.data !== "string") {
        player.port.postMessage(e.data, [e.data]);
        return;
      }
      var m = JSON.parse(e.data);
      if (m.type === "mode") {
        modeNote.textContent = m.mode === "live" ? "" :
          "TEST MODE (" + m.mode + "): your microphone is NOT used and the call hangs up by itself. " +
          "Remove audio_file / external_tone from the Postman body for a live call.";
        return;
      }
      if (m.type === "state") setStatus(labels[m.state] || m.state);
    };
    ws.onerror = function () { setStatus("Could not connect to the bridge audio."); };
    ws.onclose = function () { cleanup(); };
  }

  startBtn.onclick = start;
  muteBtn.onclick = function () {
    muted = !muted;
    muteBtn.textContent = muted ? "Unmute" : "Mute";
  };
  hangBtn.onclick = function () {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "hangup" }));
  };
})();
</script>
</body>
</html>
